apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv-volume
  labels:
    type: local
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    name: minio-pvc
  hostPath:
    path: "/data/minio_home"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 95Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # RustFS runs as non-root uid/gid 10001; fsGroup makes the PVC writable.
      securityContext:
        fsGroup: 10001
      containers:
      # Name/labels deliberately kept as "minio" so the Service selector,
      # the deploy script's `kubectl wait -l app=minio`, and the hardcoded
      # endpoint minio.default.svc.cluster.local:9000 all keep working.
      - name: minio
        # Upstream quay.io/minio/minio was removed from all public registries.
        # RustFS is an Apache-2.0, S3-compatible replacement (native arm64).
        image: rustfs/rustfs:latest
        # No args: the image entrypoint starts the server itself.
        env:
        - name: RUSTFS_ACCESS_KEY
          value: "minioadmin"
        - name: RUSTFS_SECRET_KEY
          value: "minioadmin"
        - name: RUSTFS_VOLUMES
          value: "/data"
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        - name: RUSTFS_CONSOLE_ADDRESS
          value: ":9001"
        # Serve HTTPS on :9000 - cos-s3-csi-sc.yaml expects https://minio...:9000
        - name: RUSTFS_TLS_PATH
          value: "/certs"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: minio-tls-certs
          mountPath: /certs
          readOnly: true
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
      volumes:
      - name: minio-tls-certs
        secret:
          secretName: minio-tls-secret
          items:
          # RustFS requires these exact filenames in RUSTFS_TLS_PATH.
          - key: tls.crt
            path: rustfs_cert.pem
          - key: tls.key
            path: rustfs_key.pem
      - name: data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: minio-tls-secret
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: api
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: console
  selector:
    app: minio
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-console
  annotations:
    haproxy.router.openshift.io/timeout: 900s
spec:
  port:
    targetPort: 9001
  to:
    kind: Service
    name: minio
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-api
  annotations:
    haproxy.router.openshift.io/timeout: 900s
spec:
  port:
    targetPort: 9000
  to:
    kind: Service
    name: minio
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
